function repairSnapshotIds(snapshot){
  const seenEvents = new Set();
  const events = (snapshot.events || []).map(event => {
    const repaired = { ...event };
    if (!repaired.id || seenEvents.has(repaired.id)) repaired.id = uid();
    seenEvents.add(repaired.id);
    return repaired;
  });
  const seenLabels = new Set();
  const labels = (snapshot.labels || []).map(label => {
    const repaired = { ...label };
    if (!repaired.id || seenLabels.has(repaired.id)) repaired.id = 'lb_' + uid().slice(0,8);
    seenLabels.add(repaired.id);
    return repaired;
  });
  return { ...snapshot, events, labels };
}

function mergeSyncSnapshots(localSnapshot, remoteSnapshot){
  const events = new Map();
  const eventTime = event => {
    const value = Date.parse(event.updatedAt || event.createdAt || '');
    return Number.isFinite(value) ? value : 0;
  };
  const eventKey = event => {
    const isOfficial = event.labelId === 'lb_cityu' || event.labelId === 'lb_holiday';
    return isOfficial
      ? `official|${event.labelId}|${event.title || ''}|${event.start || ''}|${event.end || ''}`
      : event.id || event.externalUid || `${event.title || ''}|${event.start || ''}|${event.end || ''}`;
  };
  const repairedRemote = repairSnapshotIds(remoteSnapshot);
  const repairedLocal = repairSnapshotIds(localSnapshot);
  repairedRemote.events.forEach(event => {
    const key = eventKey(event);
    events.set(key, event);
  });
  repairedLocal.events.forEach(event => {
    const key = eventKey(event);
    const current = events.get(key);
    if (!current || eventTime(event) > eventTime(current)) events.set(key, event);
  });
  const labels = new Map();
  [...repairedRemote.labels, ...repairedLocal.labels].forEach(label => {
    const key = label.id || `name:${label.name || ''}`;
    if (!labels.has(key)) labels.set(key, label);
  });
  return {
    events:[...events.values()],
    labels:[...labels.values()],
    settings:{ ...(remoteSnapshot.settings || {}), ...(localSnapshot.settings || {}) },
    meta:{ ...(remoteSnapshot.meta || {}), ...(localSnapshot.meta || {}) },
  };
}

async function syncCalendar({ silent = false } = {}){
  const config = getSyncConfig();
  if (!config.supabaseUrl || !config.supabaseAnonKey) {
    toast('Sync is enabled but the Supabase URL or anon key is missing.', { icon:'x', timeout:9000 });
    return false;
  }
  try {
    const baseUrl = config.supabaseUrl.replace(/\/$/, '');
    const headers = { 'apikey': config.supabaseAnonKey, 'Authorization': `Bearer ${config.supabaseAnonKey}`, 'Content-Type': 'application/json', 'Accept': 'application/json' };
    const localSnapshot = { events:DB.events.list(), labels:DB.labels.list(), settings:getPublicSyncSettings(), meta:{ seeded:true } };
    const pullResponse = await fetch(`${baseUrl}/rest/v1/quad_sync?token=eq.${encodeURIComponent(config.token)}&select=snapshot,updated_at`, { method:'GET', headers });
    if (!pullResponse.ok) throw new Error(`Supabase pull HTTP ${pullResponse.status}: ${await pullResponse.text()}`);
    const remoteRows = await pullResponse.json();
    let remoteRow = remoteRows[0] || null;
    let snapshot = mergeSyncSnapshots(localSnapshot, remoteRow?.snapshot || {});
    DB.applySnapshot(snapshot);
    let savedRows = [];
    for (let attempt = 0; attempt < 3; attempt++) {
      const nextUpdatedAt = new Date().toISOString();
      const response = await fetch(`${baseUrl}/rest/v1/quad_sync?on_conflict=token`, {
        method: 'POST',
        headers: { ...headers, 'Prefer':'resolution=merge-duplicates,return=representation' },
        body: JSON.stringify({ token:config.token, device_id:config.deviceId, snapshot, updated_at:nextUpdatedAt }),
      });
      const responseText = await response.text();
      if (!response.ok) {
        if (response.status !== 409) {
          throw new Error(`Supabase save HTTP ${response.status}: ${responseText}`);
        }
        savedRows = [];
      } else {
        savedRows = JSON.parse(responseText || '[]');
      }
      if (savedRows.length) break;
      const retryResponse = await fetch(`${baseUrl}/rest/v1/quad_sync?token=eq.${encodeURIComponent(config.token)}&select=snapshot,updated_at`, { method:'GET', headers });
      if (!retryResponse.ok) throw new Error(`Supabase retry pull HTTP ${retryResponse.status}: ${await retryResponse.text()}`);
      const retryRows = await retryResponse.json();
      remoteRow = retryRows[0] || null;
      snapshot = mergeSyncSnapshots(localSnapshot, remoteRow?.snapshot || {});
      DB.applySnapshot(snapshot);
      if (attempt === 2) {
        throw new Error('Supabase upsert did not return the saved calendar row.');
      }
    }
    if (!savedRows.length) throw new Error('Supabase save conflicted with a newer device update. Please sync again.');
    if (savedRows[0]?.snapshot) {
      DB.applySnapshot(savedRows[0].snapshot);
      if (!silent) toast(`Calendar synced: ${savedRows[0].snapshot.events?.length || 0} events shared.`, { icon:'check' });
    } else if (!silent) {
      toast('Calendar synced, but Supabase returned no snapshot.', { icon:'x' });
    }
    DB.settings.set('syncLastSync', new Date().toISOString());
    return true;
  } catch (err) {
    console.error('Sync failed:', err);
    toast(`Sync failed: ${err.message}`.slice(0, 220), { icon:'x', timeout:9000 });
    return false;
  }
}

function openSyncDialog(){
  const config = getSyncConfig();
  const { close, el } = openModal(`
    <div class="m-title">Sync settings</div>
    <div class="modal-body">
      <div class="f-row"><div class="f-main"><span class="f-lab">Supabase project URL</span><input class="inp inp-full" id="supabaseUrl" value="${esc(config.supabaseUrl)}" placeholder="https://your-project.supabase.co"/></div></div>
      <div class="f-row"><div class="f-main"><span class="f-lab">Supabase anon key</span><input class="inp inp-full" id="supabaseAnonKey" value="${esc(config.supabaseAnonKey)}" placeholder="eyJhbGciOiJIUzI1NiIs..."/></div></div>
      <div class="f-row"><div class="f-main"><span class="f-lab">Shared calendar key</span><input class="inp inp-full" id="syncToken" value="${esc(config.token)}" maxlength="64"/></div></div>
      <div class="f-row"><div class="f-main"><span class="f-lab">Device id</span><input class="inp inp-full" id="syncDeviceId" value="${esc(config.deviceId)}" maxlength="64"/></div></div>
      <div class="f-row"><div class="f-main"><label class="check-row"><input type="checkbox" id="syncEnabled" ${config.enabled ? 'checked' : ''}/> <span>Enable sync on this device</span></label></div></div>
    </div>
    <div class="m-foot"><span class="spacer"></span><button class="btn" id="syncTest">Sync now</button><button class="btn btn-primary" id="syncSave">Save</button></div>`, { width:440 });
  el.querySelector('#syncSave').onclick = () => {
    const supabaseUrl = el.querySelector('#supabaseUrl').value.trim();
    const supabaseAnonKey = el.querySelector('#supabaseAnonKey').value.trim();
    const token = el.querySelector('#syncToken').value.trim() || 'shared-cityu-calendar';
    const deviceId = el.querySelector('#syncDeviceId').value.trim() || config.deviceId;
    const enabled = el.querySelector('#syncEnabled').checked;
    DB.settings.set('supabaseUrl', supabaseUrl);
    DB.settings.set('supabaseAnonKey', supabaseAnonKey);
    DB.settings.set('syncToken', token);
    DB.settings.set('syncDeviceId', deviceId);
    DB.settings.set('syncEnabled', enabled);
    close();
    toast(enabled ? 'Sync enabled.' : 'Sync settings saved.', { icon:'check' });
    if (enabled) setTimeout(() => syncCalendar({ silent:false }), 100);
  };
  el.querySelector('#syncTest').onclick = async () => {
    const supabaseUrl = el.querySelector('#supabaseUrl').value.trim();
    const supabaseAnonKey = el.querySelector('#supabaseAnonKey').value.trim();
    const token = el.querySelector('#syncToken').value.trim() || 'shared-cityu-calendar';
    const deviceId = el.querySelector('#syncDeviceId').value.trim() || config.deviceId;
    DB.settings.set('supabaseUrl', supabaseUrl);
    DB.settings.set('supabaseAnonKey', supabaseAnonKey);
    DB.settings.set('syncToken', token);
    DB.settings.set('syncDeviceId', deviceId);
    DB.settings.set('syncEnabled', el.querySelector('#syncEnabled').checked);
    close();
    await syncCalendar({ silent: false });
  };
}

async function menuAction(act){
  if (act === 'json'){
    const data = { app:'quad', version:1, exportedAt:new Date().toISOString(),
      events:DB.events.list(), labels:DB.labels.list() };
    download(`quad-backup-${toDateStr(new Date()).replace(/-/g,'')}.json`, JSON.stringify(data, null, 2), 'application/json');
    toast('Backup downloaded.', { icon:'download' });
  }
  if (act === 'import') $('#importFile').click();
  if (act === 'syncConfig') openSyncDialog();
  if (act === 'syncNow') await syncCalendar({ silent: false });
  if (act === 'icsImport') $('#importIcsFile').click();
  if (act === 'guide') openGuide();
  if (act === 'wipe'){
    const ok = await confirmDialog({
      title:'Erase all calendar data?',
      body:'Your events, labels, settings, and reminders will be removed from this browser. Default labels and holidays will be restored on reload.',
      confirmText:'Erase all data'
    });
    if (ok){
      DB.wipe();
      location.reload();
    }
  }
  if (act === 'ics'){
    const BY = ['SU','MO','TU','WE','TH','FR','SA'];
    const icsEsc = s => String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
    const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
    let out = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Quad//Four-Year Planner//EN','CALSCALE:GREGORIAN'];
    for (const ev of DB.events.list()){
      const l = DB.labels.get(ev.labelId);
      out.push('BEGIN:VEVENT', `UID:${ev.id}@quad`, `DTSTAMP:${stamp}`, `SUMMARY:${icsEsc(ev.title)}`);
      if (ev.allDay){
        const endEx = toDateStr(addDays(parseDate(ev.end),1)).replace(/-/g,'');
        out.push(`DTSTART;VALUE=DATE:${ev.start.replace(/-/g,'')}`, `DTEND;VALUE=DATE:${endEx}`);
      } else {
        out.push(`DTSTART:${ev.start.replace(/[-:]/g,'')}`, `DTEND:${ev.end.replace(/[-:]/g,'')}`);
      }
      if (ev.repeat !== 'none'){
        let rr = ev.repeat === 'daily' ? 'FREQ=DAILY' : ev.repeat === 'monthly' ? 'FREQ=MONTHLY'
          : 'FREQ=WEEKLY;BYDAY=' + (ev.repeat === 'weekdays' ? 'MO,TU,WE,TH,FR'
            : (ev.byday||[parseDT(ev.start).getDay()]).map(i => BY[i]).join(','));
        if (ev.until) rr += ';UNTIL=' + ev.until.replace(/-/g,'');
        out.push(`RRULE:${rr}`);
      }
      if (l) out.push(`CATEGORIES:${icsEsc(l.name)}`);
      if (ev.location) out.push(`LOCATION:${icsEsc(ev.location)}`);
      if (ev.notes) out.push(`DESCRIPTION:${icsEsc(ev.notes)}`);
      (ev.reminders||[]).forEach(m => out.push('BEGIN:VALARM', `TRIGGER:-PT${m}M`, 'ACTION:DISPLAY',
        `DESCRIPTION:${icsEsc(ev.title)}`, 'END:VALARM'));
      out.push('END:VEVENT');
    }
    out.push('END:VCALENDAR');
    download('quad-calendar.ics', out.join('\r\n'), 'text/calendar');
    toast('Exported for Google / Apple Calendar.', { icon:'file' });
  }
}
 $('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data.events) || !Array.isArray(data.labels)) throw 0;
      const ok = await confirmDialog({ title:'Restore this backup?',
        body:`It contains ${data.events.length} event(s) and will replace everything currently stored in this browser.`,
        confirmText:'Replace' });
      if (ok){ DB.restore(data); toast(`Restored ${data.events.length} events.`, { icon:'check' }); }
    } catch(err){ toast('That file is not a valid Quad backup.', { icon:'x' }); }
    e.target.value = '';
  };
  r.readAsText(f);
};

$('#importIcsFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const parsed = parseIcsEvents(r.result);
      const existing = DB.events.list();
      const fresh = parsed.filter(item => !existing.some(event =>
        (item.externalUid && event.externalUid === item.externalUid) ||
        (event.title === item.title && event.start === item.start && event.end === item.end)));
      if (!fresh.length){ toast('No new events found in that calendar.', { icon:'file' }); return; }
      const ok = await confirmDialog({ title:'Import calendar events?', body:`Found ${parsed.length} event(s); ${fresh.length} new event(s) will be added.`, confirmText:'Import' });
      if (ok){ fresh.forEach(item => DB.events.create(item)); toast(`Imported ${fresh.length} event(s).`, { icon:'upload' }); }
    } catch(err){ toast('That file is not a readable ICS calendar.', { icon:'x' }); }
    e.target.value = '';
  };
  r.readAsText(f);
};

/* ─── 8. GUIDE, SHORTCUTS & BOOT ────────────────────────────── */

const GUIDE_STEPS = [
  { ill:'cal', eyebrow:'Welcome to Quad', title:'Your four years,<br>on one calm grid.',
    body:'The calendar starts completely empty — what appears here is entirely yours to create. A few public holidays for the coming years are pre-loaded as light all-day entries; hide the <b>Holidays</b> label anytime with one click in the sidebar.' },
  { ill:'pencil', eyebrow:'Fill it with your life', title:'Click a day. Drag a week. Done.',
    body:'Click any date to add an event. In <b>Week view</b>, drag across the grid to block out a lecture or study session. Every event can <b>repeat</b> (perfect for weekly classes), carry a colour label, a location, notes and reminders.' },
  { ill:'bell', eyebrow:'Make it yours — and keep it safe', title:'One last thing',
    body:'Labels double as filters: toggle them in the sidebar to focus. Everything is stored <b>privately in this browser</b> — export a backup from the menu now, and again at the end of each semester.',
    keys:true },
];
let guideStep = 0, guideEl = null;
function renderGuide(){
  const s = GUIDE_STEPS[guideStep];
  guideEl.innerHTML = `<div class="gcard">
    <div class="g-ill">${I(s.ill,22)}</div>
    <div class="g-eyebrow">${s.eyebrow}</div>
    <div class="g-title">${s.title}</div>
    <div class="g-body">${s.body}</div>
    ${s.keys ? `<div class="g-keys">
      <span><kbd>C</kbd> new event</span><span><kbd>T</kbd> today</span><span><kbd>M</kbd><kbd>W</kbd><kbd>A</kbd> views</span>
      <span><kbd>←</kbd><kbd>→</kbd> move</span><span><kbd>/</kbd> search</span><span><kbd>?</kbd> guide</span></div>` : ''}
    <div class="g-foot">
      <div class="g-dots">${GUIDE_STEPS.map((_,i) => `<span class="g-dot ${i===guideStep?'on':''}"></span>`).join('')}</div>
      <button class="g-skip" id="gSkip">Skip</button>
      <button class="btn btn-primary" id="gNext" style="padding:10px 20px">${guideStep < GUIDE_STEPS.length-1 ? 'Next' : 'Start planning'}</button>
    </div></div>`;
  guideEl.querySelector('#gSkip').onclick = finishGuide;
  guideEl.querySelector('#gNext').onclick = () => {
    if (guideStep < GUIDE_STEPS.length - 1){ guideStep++; renderGuide(); } else finishGuide(); };
}
function finishGuide(){
  guideEl.remove(); guideEl = null;
  DB.settings.set('onboarded', true);
  toast('Tip: press C to add your first event.', { icon:'plus', timeout:7000 });
}
function openGuide(){ guideStep = 0;
  if (!guideEl){ guideEl = document.createElement('div'); guideEl.id = 'guide'; document.body.appendChild(guideEl); }
  renderGuide(); }

/* global wiring */
 $('#newBtn').onclick = () => quickCreate(state.view === 'week' ? state.date : new Date());
 $('#todayBtn').onclick = () => { state.date = new Date(); saveState(); render(); };
 $('#prevBtn').onclick = () => navPeriod(-1);
 $('#nextBtn').onclick = () => navPeriod(1);
 $('#helpBtn').onclick = openGuide;
 $('#viewSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
  state.view = b.dataset.v; saveState(); render(); });
 $('#sbToggle').onclick = () => document.body.classList.toggle('sb-open');
 $('#sbscrim').onclick = () => document.body.classList.remove('sb-open');

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (activePop) return closePopover();
    if (guideEl) return finishGuide();
    const top = modalStack[modalStack.length-1]; if (top) top.close();
    return;
  }
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (typing || modalStack.length || guideEl) return;
  const k = e.key.toLowerCase();
  if (k === 'c' || k === 'n'){ e.preventDefault(); quickCreate(state.view === 'week' ? state.date : new Date()); }
  else if (k === 't'){ state.date = new Date(); saveState(); render(); }
  else if (k === 'm') { state.view = 'month'; saveState(); render(); }
  else if (k === 'w') { state.view = 'week';  saveState(); render(); }
  else if (k === 'a') { state.view = 'agenda';saveState(); render(); }
  else if (k === '/'){ e.preventDefault(); qInput.focus(); }
  else if (e.key === '?') openGuide();
  else if (e.key === 'ArrowLeft') navPeriod(-1);
  else if (e.key === 'ArrowRight') navPeriod(1);
});

/* boot */
DB.ready.then(() => {
  if (localStorage.getItem(APP_VERSION_KEY) !== APP_VERSION) {
    DB.wipe();
    localStorage.setItem(APP_VERSION_KEY, APP_VERSION);
    location.reload();
    return;
  }
  state.view = DB.settings.get('view', 'month');
  state.date = parseDate(DB.settings.get('date', toDateStr(new Date())));
  state.hidden = new Set(DB.settings.get('hidden', []));
  render();
  if (DB.settings.get('syncEnabled', false)) setTimeout(() => syncCalendar({ silent:true }), 300);
  setInterval(() => { Reminders.tick(); updateNowLine(); }, 30000);
  Reminders.tick();
  if (!DB.settings.get('onboarded', false)) setTimeout(openGuide, 350);
});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
